spring:
  config:
    import: "optional:classpath:application-secret.yml"

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-proj-YOUR_API_KEY_HERE}

  # Cấu hình R2DBC (Reactive) cho MariaDB
  r2dbc:
    url: r2dbc:mariadb://localhost:3306/bizocr
    username: root
    password: "049206"
    pool:
      initial-size: 5
      max-size: 20

  # Tự động chạy file schema.sql lúc khởi động
  sql:
    init:
      mode: always

  data:
    redis:
      host: localhost
      port: 6379
      password: "049206"
      database: 0
      connect-timeout: 5000ms
      timeout: 5000ms

logging:
  level:
    org.springframework.r2dbc: DEBUG # Xem log câu lệnh SQL chạy ngầm

