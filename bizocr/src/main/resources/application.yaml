spring:
  config:
    import: "optional:classpath:application-secret.yml"

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:qwen2.5:7b}
        temperature: 0.0

  # Cấu hình R2DBC (Reactive) cho MariaDB — chạy local trên máy Windows
  r2dbc:
    url: r2dbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bizocr}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 5
      max-size: 20

  sql:
    init:
      mode: always

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      connect-timeout: 5000ms
      timeout: 5000ms

#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: ${JWT_ISSUER_URI:https://auth.company.com/realms/bizocr}

logging:
  level:
    org.springframework.r2dbc: DEBUG

bizocr:
  python-service:
    url: ${PYTHON_SERVICE_URL:http://localhost:8000}
  classification:
    ai-confidence-threshold: 0.80