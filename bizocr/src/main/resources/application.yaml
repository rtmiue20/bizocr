spring:
  config:
    import: "optional:classpath:application-secret.yml"

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:qwen2.5:3b-instruct}
        temperature: 0.0

  # R2DBC (Reactive) cho MariaDB
  r2dbc:
    url: r2dbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bizocr}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    pool:
      initial-size: 5
      max-size: 20

  # Tự động chạy schema.sql lúc khởi động (CREATE TABLE IF NOT EXISTS -> an toàn khi DB đã có data)
  sql:
    init:
      mode: always

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      connect-timeout: 5000ms
      timeout: 5000ms

#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: ${JWT_ISSUER_URI:https://auth.company.com/realms/bizocr}

logging:
  level:
    org.springframework.r2dbc: DEBUG   # Xem log câu SQL chạy ngầm — tắt ở production

bizocr:
  python-service:
    url: ${PYTHON_SERVICE_URL:http://localhost:8000}

  tax-search:
    service:
      url: ${TAX_SEARCH_SERVICE_URL:http://localhost:8000}
      provider: duckduckgo  # Chỉ định dùng DuckDuckGo qua Python Service

  classification:
    ai-confidence-threshold: 0.80

  validator:
    shadow-mode: ${VALIDATOR_SHADOW_MODE:true}

  ollama:
    auto-manage: true      # true = Spring Boot tự quản lý Ollama process
    force-cpu: true         # true = ép CPU-only
    startup-timeout-seconds: 60

---
# Kích hoạt bằng: -Dspring.profiles.active=docker  (hoặc SPRING_PROFILES_ACTIVE=docker)
spring:
  config:
    activate:
      on-profile: docker

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434}

  r2dbc:
    url: r2dbc:mariadb://${DB_HOST:mariadb}:${DB_PORT:3306}/${DB_NAME:bizocr}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

bizocr:
  python-service:
    url: ${PYTHON_SERVICE_URL:http://extractor-service:8000}
  tax-search:
    service:
      url: ${TAX_SEARCH_SERVICE_URL:http://extractor-service:8000}
      provider: duckduckgo